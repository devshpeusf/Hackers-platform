<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #21e6c1; text-decoration: none; }
    a:hover { color: #ff8fd6; }
    .pxbtn { transition: transform 0.2s cubic-bezier(0.32,0.72,0,1), filter 0.2s; }
    .pxbtn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.12; } }
    /* scanlines + inner glow, carried over from .hj-crt in the HackJam site */
    .crt {
      background-image: repeating-linear-gradient(to bottom, rgba(0,0,0,0.32) 0px, rgba(0,0,0,0.32) 1px, transparent 1px, transparent 3px);
      box-shadow: inset 0 0 46px rgba(33,230,193,0.10), inset 0 0 110px rgba(0,0,0,0.6);
      opacity: 0.5;
    }
    /* sits over the cabinet's own gold six-button cluster */
    .cluster {
      border-radius: 60px; cursor: pointer;
      animation: cluster 1.6s ease-in-out infinite;
      transition: transform 0.09s ease-out;
    }
    .cluster:hover { transform: translateY(4px); }
    @keyframes cluster {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,214,64,0); }
      50% { box-shadow: 0 0 44px 12px rgba(255,214,64,0.45); }
    }
  </style>
</helmet>
